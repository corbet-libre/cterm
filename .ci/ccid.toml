schema = 1
project = "cterm"

# Linux requires existing GTK/Wayland/protobuf/native tools. macOS/Windows/FreeBSD and UI runtime/compatibility gates remain separate; canonical dirty WIP is not included.

[checks.linux]
kind = "commands"
commands = [["bash", ".ci/linux.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["nix", "--version"]]

[checks.fmt]
kind = "cargo"
actions = ["fmt"]

[checks.ui]
kind = "commands"
commands = [["bash", ".ci/ui.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["nix", "--version"], ["weston", "--version"]]

[render]
tool_revision = "78a4e05b4e1cb25aaeba3966951564d74277bcbd"

[jobs.verify]
scheduler = "crow"
checks = ["linux", "fmt", "ui"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]
